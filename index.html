<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Demo LMS luyện Toán 10, 11, 12 mỗi ngày: giáo viên giao bài theo lớp và trình độ, chuyên đề và tài liệu, học sinh tự luyện và sửa lỗi sai.">
<title>Toán Mỗi Ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
/* Layout: app shell LMS sáng, khối điều hướng và thẻ bài mang màu bảng xanh, chữ phấn — sidebar trái (desktop) / thanh tab dưới (điện thoại), vùng nội dung dạng bảng điều khiển; màn làm bài toàn màn hình từng câu một */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --surface-2:#edf1ea; --line:rgba(23,37,29,.12); --line-2:rgba(23,37,29,.26);
  --ink:#17251d; --ink-2:#34463b; --muted:#5d6b62;
  --primary:#23573f; --primary-2:#184330; --on-primary:#ffffff; --primary-soft:#e3efe7;
  --success:#12913e; --success-soft:#e0f4e5;
  --danger:#d2352b; --danger-soft:#fde8e6;
  --warn:#b36b00; --warn-soft:#fff1da;
  --t1:#2563c9; --t2:#b8327f; --t3:#0e8a7a; --t4:#e0661a; --t5:#7a4fc0; --t6:#8a6a12;
  --board:#2d4a3b; --board-2:#24402f; --wood:#a46f3e; --chalk:#f3f0e4; --chalk-y:#ffe066;
  --band:var(--board); --hard:var(--ink); --yellow:#ffd84d; --navy:var(--ink);
  --shadow:0 1px 2px rgba(23,37,29,.05),0 4px 14px rgba(23,37,29,.05);
  --f-head:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-chalk:"Itim","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
/* giao diện luôn sáng, kể cả khi máy đang ở chế độ tối */

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em;font-weight:600}
h1{font-size:26px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
button{font-family:inherit}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.ic.sm{width:16px;height:16px}
.ic.lg{width:26px;height:26px}

/* ---------- khung app ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo .m{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:17px}
.logo b{font-family:var(--f-head);font-size:16.5px;font-weight:700;display:block;line-height:1.1}
.logo span{font-size:11.5px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--ink-2);font-size:14.5px;font-weight:500;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .badge{margin-left:auto}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.side .spacer{flex:1}
.rolecard{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--muted)}

.content{min-width:0;display:flex;flex-direction:column;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-block:28px 22px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.topbar .r{display:flex;align-items:center;gap:10px}
.chip-date{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.toprole{display:none}
main{display:flex;flex-direction:column;gap:20px;padding-bottom:28px;min-width:0}
footer.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);padding-block:8px 28px;border-top:1px solid var(--line);margin-top:auto}
.bnav{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar{padding-block:16px 14px;align-items:center}
  h1{font-size:22px}
  .toprole{display:flex;align-items:center;gap:8px;width:100%}
  .toprole .seg{flex:none}
  .toprole select{flex:1}
  .topbar .chip-date{display:none}
  main{padding-bottom:20px}
  footer.foot{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 2px;cursor:pointer;position:relative;min-width:0}
  .bnav button span.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bnav button[aria-current="page"]{color:var(--primary)}
  .bnav .badge{position:absolute;top:0;left:calc(50% + 6px);height:17px;min-width:17px;font-size:10.5px}
}

/* ---------- thành phần ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:18px 20px 0}
.card-h p{font-size:13px;color:var(--muted);margin-top:2px}
.card-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row>*,.card-b>*,main>*{min-width:0;max-width:100%}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.g3{grid-template-columns:minmax(0,1fr)}}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1050px){.split,.split.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.kpi{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}.kpi .v{font-size:24px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--primary);color:var(--on-primary);white-space:nowrap;transition:background .12s,box-shadow .12s}
.btn:hover{background:var(--primary-2)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover{background:var(--surface-2)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.soft:hover{background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.btn.ghost{background:transparent;color:var(--primary);padding-inline:8px}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 22px;font-size:15.5px;border-radius:12px}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line-2)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=password],input[type=date],select,textarea{font:14.5px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
textarea{resize:vertical;min-height:64px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip.ok{background:var(--success-soft);color:var(--success)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.pri{background:var(--primary-soft);color:var(--primary)}
.chip.topic{background:color-mix(in srgb,var(--tc) 13%,var(--surface));color:var(--tc)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.fchip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.av{--c:var(--primary);width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;font-family:var(--f-head)}
.av.lg{width:52px;height:52px;font-size:17px}
.av.sm{width:26px;height:26px;font-size:10.5px}
.avstack{display:flex}
.avstack .av{border:2px solid var(--surface);margin-left:-8px}
.avstack .av:first-child{margin-left:0}

.kpi{padding:18px 20px;display:flex;align-items:center;gap:16px}
.kpi .t{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-head);font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring span{position:relative;font-family:var(--f-head);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.spark{display:block;margin-top:4px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr{cursor:default}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--bg)}
td select{width:auto;padding:5px 8px;font-size:13px;border-radius:8px}
.person{display:flex;align-items:center;gap:10px}
.person b{font-weight:600}
.days{display:flex;gap:4px}
.days i{width:12px;height:12px;border-radius:4px;background:var(--surface-2)}
.days i.ok{background:var(--success)}
.days i.mid{background:var(--warn)}
.days i.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--danger)}

.course{overflow:hidden;display:flex;flex-direction:column}
.course .band{height:76px;background:var(--tc);position:relative;padding:14px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.course .band::after{content:attr(data-g);position:absolute;right:12px;bottom:-14px;font-family:var(--f-head);font-size:64px;font-weight:700;opacity:.18;line-height:1}
.course .band b{font-family:var(--f-head);font-size:16px;font-weight:600}
.course .band span{font-size:12px;opacity:.9;font-weight:600}
.course .cb{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.prog{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:var(--success)}
.course.empty{border-style:dashed;box-shadow:none;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;color:var(--muted)}

.attn{display:flex;flex-direction:column}
.attn .it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.attn .it:last-child{border-bottom:0}
.attn .it .row{gap:6px;margin-top:4px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .qt{font-weight:500;overflow-wrap:anywhere}
.qn{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;font-family:var(--f-head)}
.bank{max-height:520px;overflow:auto;margin:0 -20px;padding:0 20px}

.newq{border:1.5px dashed var(--primary);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--primary-soft)}
.note{font-size:13.5px;font-weight:500;padding:11px 14px;border-radius:10px;display:flex;gap:10px;align-items:flex-start}
.note.ok{background:var(--success-soft);color:var(--success)}
.note.bad{background:var(--danger-soft);color:var(--danger)}

.people{display:flex;flex-direction:column;padding:8px}
.people button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:10px;cursor:pointer;text-align:left;color:var(--ink)}
.people button:hover{background:var(--surface-2)}
.people button[aria-current="true"]{background:var(--primary-soft)}
.people .nm{flex:1;min-width:0}
.people .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people .nm span{font-size:12px;color:var(--muted)}
.wsplit{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1050px){.wsplit{grid-template-columns:minmax(0,1fr)}.people{flex-direction:row;overflow-x:auto}.people button{flex:none}.people .nm span{display:none}}

details.sub{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.sub+details.sub{margin-top:10px}
details.sub>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary .grow{flex:1;min-width:0}
details.sub>summary .grow b{display:block;font-weight:600}
details.sub>summary .chev{transition:transform .15s;color:var(--muted)}
details.sub[open]>summary .chev{transform:rotate(90deg)}
details.sub .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.datebox{width:44px;text-align:center;border-radius:10px;background:var(--surface-2);padding:5px 0;flex:none;line-height:1.15}
.datebox b{display:block;font-family:var(--f-head);font-size:17px}
.datebox span{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase}

.qr{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.qr.bad{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.qr .h{display:flex;gap:10px;align-items:flex-start}
.qr .h .qt{flex:1;font-weight:600;overflow-wrap:anywhere}
.ansl{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2)}
.ansl .w{color:var(--danger);font-weight:700;text-decoration:line-through}
.ansl .r{color:var(--success);font-weight:700}
.explain{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.explain b{color:var(--ink)}
.work{border-left:3px solid var(--line-2);padding:2px 10px;font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.work.bad{border-left-color:var(--danger)}

.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:13.5px}
.hbar .tr{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:10px}
.hbar .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.heat td{text-align:center}
.heat td:first-child{text-align:left}
.cell{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:84px;height:44px;border-radius:10px;font-weight:700;font-size:14px;line-height:1.1}
.cell small{font-size:10.5px;font-weight:500;opacity:.8}
.cell.hi{background:var(--success-soft);color:var(--success)}
.cell.md{background:var(--warn-soft);color:var(--warn)}
.cell.lo{background:var(--danger-soft);color:var(--danger)}
.cell.na{background:var(--surface-2);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px}

/* học sinh */
.today{overflow:hidden}
.today .band{background:var(--tc);color:#fff;padding:22px 24px;position:relative;overflow:hidden}
.today .band::after{content:attr(data-g);position:absolute;right:20px;top:50%;transform:translateY(-50%);font-family:var(--f-head);font-size:110px;font-weight:700;opacity:.16;line-height:1}
.today .band .k{font-size:12.5px;font-weight:600;opacity:.92;display:flex;gap:8px;align-items:center}
.today .band h2{font-size:24px;margin-top:6px;color:#fff}
.today .band .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;opacity:.95}
.today .band .meta span{display:inline-flex;align-items:center;gap:6px}
.today .tb{padding:18px 24px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.today .tb .grow{flex:1;min-width:200px}
.streak{display:flex;align-items:center;gap:14px}
.flame{width:48px;height:48px;border-radius:14px;background:var(--warn-soft);color:var(--t4);display:grid;place-items:center;flex:none}

function graphSvg(){

    ${t(W - 16, oy + 18, 'x')}${t(ox - 10, 18, 'y')}${t(ox - 9, oy + 16, 'O')}${t(X(-1), oy + 16, '−1')}${t(X(1), oy - 7, '1')}${t(X(2), oy + 16, '2')}${t(X(-2), oy - 7, '−2')}${t(ox + 6, +Y(2) + 4, '2', 'start')}${t(ox - 6, +Y(-2) + 4, '−2', 'end')}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

function makePdf(title, lines){
  const e = s => s.replace(/[\\()]/g, m => '\\' + m);
  let content = `BT /F1 20 Tf 56 780 Td (${e(title)}) Tj ET\n`, y = 738;
  for (const l of lines) { content += `BT /F1 13 Tf 56 ${y} Td (${e(l)}) Tj ET\n`; y -= 24; }
  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>', `<< /Length ${content.length} >>\nstream\n${content}endstream`];
  let pdf = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(pdf.length); pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('') + `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return 'data:application/pdf;base64,' + btoa(pdf);
}
function trigTableSvg(){
  const rows = [['α','0°','30°','45°','60°','90°'], ['sin α','0','1/2','√2/2','√3/2','1'], ['cos α','1','√3/2','√2/2','1/2','0'], ['tan α','0','√3/3','1','√3','—']];
  const W = 520, H = 200, cw = W / 6, rh = H / 4;
  let g = '';
  rows.forEach((r, i) => r.forEach((c, j) => {
    g += `<rect x="${j * cw}" y="${i * rh}" width="${cw}" height="${rh}" fill="${i === 0 || j === 0 ? '#e9f1ec' : '#fff'}" stroke="#2d4a3b" stroke-width="1"/>`;
    g += `<text x="${j * cw + cw / 2}" y="${i * rh + rh / 2 + 6}" font-size="17" font-family="Times New Roman,serif" text-anchor="middle" fill="#17251d" ${i === 0 || j === 0 ? 'font-weight="bold"' : ''}>${c}</text>`;
  }));
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${W + 2}" height="${H + 2}" viewBox="-1 -1 ${W + 2} ${H + 2}">${g}</svg>`);
}

// ---------- xem tài liệu (ảnh, PDF) ----------
let pdfReady = null;
function loadPdfJs(){
  const add = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  return pdfReady ||= add('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')
    .then(() => add('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'))
    .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; return window.pdfjsLib; });
}
function renderViewer(){
  const el = $('#viewer'), d = ui.viewer && allDocs().find(x => x.id === ui.viewer);
  if (!d) { el.hidden = true; el.innerHTML = ''; if (!ui.player) document.body.style.overflow = ''; return; }
  el.hidden = false; document.body.style.overflow = 'hidden';
  if (el.dataset.doc === d.id && el.innerHTML) return;
  el.dataset.doc = d.id;
  el.innerHTML = `<div class="vh"><span class="ext ${d.kind}">${d.kind === 'pdf' ? 'PDF' : 'ẢNH'}</span><b>${esc(d.name)}</b><button class="iconbtn" data-act="close-doc" aria-label="Đóng">${ic('x')}</button></div>
    <div class="vb" id="vb">${d.kind === 'img' ? `<img src="${d.data}" alt="${esc(d.name)}">` : '<p class="vmsg">Đang mở PDF…</p>'}</div>`;
  if (d.kind === 'pdf') showPdf(d);
}
async function showPdf(d){
  const box = $('#vb');
  try {
    const lib = await loadPdfJs();
    const bin = atob(d.data.split(',')[1]), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const pdf = await lib.getDocument({data:bytes}).promise;
    if (ui.viewer !== d.id) return;
    box.innerHTML = `<p class="vmsg">${pdf.numPages} trang</p>`;
    const W = Math.min(900, box.clientWidth - 8);
    for (let n = 1; n <= Math.min(pdf.numPages, 30); n++) {
      const page = await pdf.getPage(n), v0 = page.getViewport({scale:1}), scale = W / v0.width * (window.devicePixelRatio || 1);
      const vp = page.getViewport({scale}), c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height; box.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
    }
  } catch (e) { box.innerHTML = '<p class="vmsg">Không mở được tệp PDF này trên trình duyệt. Thử tải lại trang.</p>'; }
}

function dayRate(d){
  let n = 0, w = 0;
  for (const b of S.submissions) { const a = A(b.aid); if (!a || a.date !== d || a.grade !== ui.grade) continue; for (const qid of a.qids) { n++; if (!isRight(Q(qid), b.answers[qid]?.value)) w++; } }
  return {n, w};
}
function weekDots(s){
  return `<div class="days" aria-label="7 ngày gần nhất">${last7().map(d => {
    const as = S.assignments.filter(a => a.date === d && sees(a, s));
    const subs = as.map(a => subFor(a.id, s.id)).filter(Boolean);
    if (!as.length) return `<i title="${fmtDate(d)}: không có bài"></i>`;
    if (!subs.length) return d === TODAY ? `<i title="Hôm nay: chưa nộp"></i>` : `<i class="miss" title="${fmtDate(d)}: bỏ lỡ"></i>`;
    const f = mean(subs.map(b => { const x = scoreOf(b); return x.c / x.t; }));
    return `<i class="${f >= 0.67 ? 'ok' : 'mid'}" title="${fmtDate(d)}: ${pct(f)} đúng"></i>`;
  }).join('')}</div>`;
}

function genExam(){
  syncCompose();

  if (!c.levels.length) { c.msg = {ok:false, text:'Tick ít nhất một trình độ trước khi tạo đề.'}; return render(); }
  if (!g.types.length) { c.msg = {ok:false, text:'Tick ít nhất một dạng câu.'}; return render(); }
  const pool = S.bank.filter(q => q.grade === ui.grade && q.levels.some(l => c.levels.includes(l)) && g.types.includes(q.type) && (!g.topics.length || g.topics.includes(q.topic)));
  const picked = shuffle(pool).slice(0, g.n).sort((x, y) => TOPICS.indexOf(x.topic) - TOPICS.indexOf(y.topic));
  c.qids = picked.map(q => q.id);
  if (!c.title.trim()) c.title = 'Đề luyện tập: ' + (g.topics.length ? g.topics.join(', ') : 'tổng hợp');
  if (g.topics.length === 1) c.topic = g.topics[0];
  c.msg = !picked.length ? {ok:false, text:'Ngân hàng chưa có câu nào khớp các lựa chọn này.'}

  render();
}
function saveNewQ(){
  syncCompose();
  const c = ui.compose, q = c.newQ;

  if (!q.levels.length) return fail('Tick ít nhất một trình độ cho câu hỏi mới.');
  if (!q.text.trim()) return fail('Câu hỏi mới chưa có đề bài.');
  if (q.type === 'num' && isNaN(parseNum(q.answer))) return fail('Đáp số phải là số, ví dụ 5, -3, 2,5 hoặc 5/6.');
  if (q.type === 'mc' && q.options.some(o => !o.trim())) return fail('Điền đủ 4 lựa chọn A, B, C, D.');
  if (q.type === 'tf' && q.statements.some(o => !o.trim())) return fail('Điền đủ 4 mệnh đề a, b, c, d.');
  const nq = {id:'q' + S.n++, grade:ui.grade, levels:[...q.levels], topic:c.topic, type:q.type, text:q.text.trim(), explain:q.explain.trim(), traps:[]};
  if (q.type === 'mc') { nq.options = q.options.map(o => o.trim()); nq.answer = nq.options[q.correct]; }
  else if (q.type === 'tf') { nq.statements = q.statements.map(o => o.trim()); nq.answer = q.tfans.join(''); }

function renameTopic(id){
  const t = S.topics.find(x => x.id === id), nv = $('#tp-name-' + id).value.trim();
  if (!nv) { ui.tpMsg = {ok:false, text:'Tên chuyên đề không được để trống.'}; return render(); }
  if (nv === t.name) return;
  if (topicsOf(t.grade).some(x => x.name === nv)) { ui.tpMsg = {ok:false, text:`Khối ${t.grade} đã có chuyên đề "${nv}".`}; return render(); }
  const old = t.name; t.name = nv;
  S.bank.forEach(q => { if (q.grade === t.grade && q.topic === old) q.topic = nv; });
  S.assignments.forEach(a => { if (a.grade === t.grade && a.topic === old) a.topic = nv; });
  for (const s of S.students) if (s.grade === t.grade && S.practice[s.id]?.[old]) { S.practice[s.id][nv] = S.practice[s.id][old]; delete S.practice[s.id][old]; }
  if (ui.bankTopic === old) ui.bankTopic = 'all';
  ui.compose = null; save(); ui.tpMsg = {ok:true, text:`Đã đổi "${old}" thành "${nv}". Câu hỏi và bài đã giao trong chuyên đề được cập nhật theo.`}; render();
}
async function uploadDocs(files, into){
  const added = [];
  for (const f of files) {
    try { const d = await readDoc(f); d.id = 'd' + S.n++; into.push(d); added.push(d); }
    catch (e) { toast(e.message || 'Không đọc được tệp ' + f.name); }
  }
  return added;
}

function analysisData(){
  const from = ui.an.range === 'all' ? '0000' : addDays(TODAY, -Number(ui.an.range) + 1);
  const qs = {}, topics = {}, per = {};
  for (const b of S.submissions) {
    const a = A(b.aid), s = STU(b.sid); if (!a || !s || a.date < from) continue;
    if (a.grade !== ui.grade) continue;
    if (ui.an.level !== 'all' && s.level !== ui.an.level) continue;
    if (ui.an.cls !== 'all' && s.cls !== ui.an.cls) continue;
    for (const qid of a.qids) {
      const q = Q(qid); if (!q) continue;
      const v = b.answers[qid]?.value, ok = isRight(q, v);
      const x = qs[qid] ||= {q, n:0, w:0, vals:{}, who:new Set()};
      x.n++; if (!ok) { x.w++; x.vals[normVal(v)] = (x.vals[normVal(v)] || 0) + 1; x.who.add(b.sid); }
      const t = topics[q.topic] ||= {n:0, w:0}; t.n++; if (!ok) t.w++;
      const p = (per[b.sid] ||= {}); const pt = p[q.topic] ||= {n:0, w:0}; pt.n++; if (!ok) pt.w++;
    }
  }
  return {qs:Object.values(qs), topics, per};
}

  const studs = SG().filter(s => d.per[s.id]);
  const filters = `<div class="row between">

    <div class="row" style="gap:6px"><button class="fchip" data-act="an-level" data-v="all" aria-pressed="${ui.an.level === 'all'}">Mọi trình độ</button>${LEVELS.map(l => `<button class="fchip" data-act="an-level" data-v="${l}" aria-pressed="${ui.an.level === l}">${l}</button>`).join('')}</div></div>`;
  const kp = `<div class="grid g4">
    <div class="card kpi"><div class="ico" style="background:var(--primary-soft);color:var(--primary)">${ic('list')}</div><div><div class="t">Lượt trả lời</div><div class="v">${total}</div></div></div>
    <div class="card kpi">${ring(total ? 1 - wrong / total : 0, 58, 7, 'var(--success)', total ? pct(1 - wrong / total) : '–')}<div><div class="t">Tỉ lệ đúng</div><div class="s">${wrong} lượt sai</div></div></div>
    <div class="card kpi"><div class="ico" style="background:var(--danger-soft);color:var(--danger)">${ic('alert')}</div><div><div class="t">Câu có người sai</div><div class="v">${d.qs.filter(s => s.w).length}<small>/${d.qs.length}</small></div></div></div>
    <div class="card kpi"><div class="ico" style="background:var(--warn-soft);color:var(--warn)">${ic('users')}</div><div><div class="t">Học sinh có bài</div><div class="v">${studs.length}</div></div></div></div>`;
  const tp = `<div class="card"><div class="card-h"><div><h2>Tỉ lệ sai theo chuyên đề</h2><p>Chuyên đề nào đang hổng nhiều nhất</p></div></div><div class="card-b">
    ${TOPICS.filter(t => d.topics[t]).sort((x, y) => d.topics[y].w / d.topics[y].n - d.topics[x].w / d.topics[x].n).map(t => { const r = d.topics[t].w / d.topics[t].n; return `<div class="hbar"><span>${esc(t)}</span><div class="tr"><i style="width:${r * 100}%;background:var(${tvar(t)})"></i></div><span class="v">${pct(r)}</span></div>`; }).join('') || '<div class="emptyst">Chưa có bài làm trong khoảng này.</div>'}
  </div></div>`;
  const heat = `<div class="card"><div class="card-h"><div><h2>Bản đồ năng lực</h2><p>Tỉ lệ làm đúng của từng học sinh theo chuyên đề</p></div></div><div class="card-b" style="padding-inline:8px">
    <div class="tbl"><table class="heat"><thead><tr><th>Học sinh</th>${TOPICS.map(t => `<th style="text-align:center">${esc(t)}</th>`).join('')}</tr></thead><tbody>
    ${studs.map(s => `<tr><td><div class="person">${avatar(s, 'sm')}<b>${esc(s.name)}</b><span class="small muted">${esc(clsName(s.cls))}</span></div></td>${TOPICS.map(t => { const p = d.per[s.id][t]; if (!p) return '<td><span class="cell na">–</span></td>'; const r = 1 - p.w / p.n; return `<td><span class="cell ${r >= 0.8 ? 'hi' : r >= 0.5 ? 'md' : 'lo'}">${pct(r)}<small>${p.n - p.w}/${p.n} câu</small></span></td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="legend" style="padding:0 12px"><span><i style="background:var(--success-soft);box-shadow:inset 0 0 0 1px var(--success)"></i>Vững (≥ 80%)</span><span><i style="background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn)"></i>Chưa chắc (50–79%)</span><span><i style="background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--danger)"></i>Cần ôn (&lt; 50%)</span></div>
  </div></div>`;
  const hq = `<div class="card"><div class="card-h"><div><h2>Câu sai nhiều nhất</h2><p>Kèm đáp án sai phổ biến để biết học sinh hiểu nhầm ở đâu</p></div>
    ${hard.length ? `<button class="btn sm" data-act="reassign">${ic('retry','sm')} Giao lại ${Math.min(4, hard.length)} câu này</button>` : ''}</div><div class="card-b">
    ${hard.length ? hard.map((s, i) => { const top = Object.entries(s.vals).sort((x, y) => y[1] - x[1])[0]; const r = s.w / s.n; return `<div class="qr">
      <div class="h"><span class="qn">${i + 1}</span><span class="qt">${esc(s.q.text)}${qImg(s.q, 'sm')}${tfList(s.q)}</span><span class="chip bad num">${pct(r)} sai</span></div>
      <div class="row small" style="gap:6px">${topicChip(s.q.topic)}${lvChips(s.q)}<span class="muted">${s.w}/${s.n} lượt sai</span></div>
      <div class="ansl"><span>Đáp án đúng: <span class="r">${esc(showVal(s.q.answer))}</span></span>${top ? `<span>Sai phổ biến: <span class="w" style="text-decoration:none">${esc(showVal(top[0]))}</span> (${top[1]} lần)</span>` : ''}</div>
      ${s.q.ww ? `<div class="work bad">Cách làm sai hay gặp: ${esc(s.q.ww)}</div>` : ''}
      <div class="row" style="gap:6px"><span class="small muted">Học sinh sai:</span>${[...s.who].map(id => STU(id)).filter(Boolean).map(x => `<span class="chip">${esc(x.name)}</span>`).join('')}</div>
    </div>`; }).join('') : '<div class="emptyst">Không có câu sai nào trong khoảng này.</div>'}
  </div></div>`;
  return filters + kp + `<div class="split even">${tp}${heat}</div>` + hq;
}

// ---------- học sinh ----------
function sHome(st){
  const as = todaysFor(st), streak = streakOf(st.id), ms = mistakes(st.id), open = ms.filter(m => !m.fixed);
  const todayCards = as.length ? as.map(a => {
    const b = subFor(a.id, st.id), sc = b && scoreOf(b);
    const wrongIds = b ? a.qids.filter(qid => !isRight(Q(qid), b.answers[qid]?.value) && !S.fixed[st.id]?.[qid]) : [];
    return `<div class="card today" style="${tcv(a.topic)}">
      <div class="band" data-g="${esc(glyph(a.topic))}"><div class="k">${ic('cal','sm')} Bài hôm nay · ${esc(a.topic)}</div><h2>${esc(a.title)}</h2>
        <div class="meta"><span>${ic('list','sm')} ${a.qids.length} câu</span><span>${ic('clock','sm')} khoảng ${a.qids.length * 3} phút</span><span>${ic('alert','sm')} Nộp trước 23:59 hôm nay</span></div></div>
      ${(a.docs || []).length ? `<div class="card-b" style="padding-bottom:0"><div class="fl">Tài liệu thầy cô gửi kèm<div class="docs">${a.docs.map(d => docChip(d)).join('')}</div></div></div>` : ''}
      <div class="tb">${b ? `${ring(sc.c / sc.t, 72, 8, sc.c === sc.t ? 'var(--success)' : 'var(--warn)', `${sc.c}/${sc.t}`)}
          <div class="grow"><h3>${sc.c === sc.t ? 'Xuất sắc, em đúng hết!' : `Em đúng ${sc.c}/${sc.t} câu · ${dec(sc.ten)} điểm`}</h3><p class="small muted">Đã nộp lúc ${b.at.slice(11)}${wrongIds.length ? ` · còn ${wrongIds.length} câu cần sửa` : ''}</p></div>
          <div class="row">${wrongIds.length ? `<button class="btn" data-act="retry" data-v="${wrongIds.join(',')}">${ic('retry','sm')} Sửa ${wrongIds.length} câu sai</button>` : ''}<button class="btn sec" data-act="review" data-v="${a.id}">${ui.review[a.id] ? 'Ẩn bài làm' : 'Xem lại bài'}</button></div>`
        : `<div class="grow"><h3>Sẵn sàng chưa?</h3><p class="small muted">Làm từng câu, có đáp án và lời giải ngay sau mỗi câu.</p></div><button class="btn cta lg" data-act="start" data-v="${a.id}">${ic('play','fill sm')} Bắt đầu làm bài</button>`}</div>
      ${b && ui.review[a.id] ? `<div class="card-b" style="border-top:1px solid var(--line);padding-top:18px">${subDetail(b, false)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="card"><div class="emptyst"><div class="ib">${ic('cal')}</div><b style="color:var(--ink)">Hôm nay chưa có bài</b>Thầy cô chưa giao bài cho lớp của em. Em có thể tự luyện ở mục Chuyên đề.<button class="btn soft sm" data-act="tab" data-v="topics">${ic('folder','sm')} Mở chuyên đề</button></div></div>`;

  const days = new Set(subsOf(st.id).map(b => A(b.aid).date));
  const had = new Set(S.assignments.filter(a => sees(a, st)).map(a => a.date));
  const streakCard = `<div class="card"><div class="card-b" style="padding-top:20px">
    <div class="streak"><div class="flame">${ic('flame','fill lg')}</div><div><div class="bignum">${streak} ngày</div><div class="small muted">chuỗi làm bài liên tiếp</div></div></div>
    <div class="week">${last7().map(d => { const ok = days.has(d), miss = !ok && d < TODAY && had.has(d); return `<div class="d"><span class="c ${ok ? 'ok' : miss ? 'miss' : ''} ${d === TODAY ? 'now' : ''}" title="${fmtDate(d)}">${ok ? ic('check','sm') : miss ? ic('x','sm') : ''}</span>${wdOf(d)}</div>`; }).join('')}</div>
    <p class="small muted">${days.has(TODAY) ? 'Hôm nay em đã giữ được chuỗi. Hẹn gặp lại ngày mai!' : 'Làm bài hôm nay để giữ chuỗi ngày nhé.'}</p>
  </div></div>`;
  const mcard = `<div class="card"><div class="card-h"><h2>Sổ lỗi sai</h2><button class="btn ghost sm" data-act="tab" data-v="mistakes">Xem tất cả ${ic('arrow','sm')}</button></div><div class="card-b">
    <div class="row" style="gap:16px">${ring(ms.length ? (ms.length - open.length) / ms.length : 0, 64, 7, 'var(--success)', `${ms.length - open.length}/${ms.length}`)}<div style="flex:1"><div><b>${open.length ? `Còn ${open.length} câu cần làm lại` : 'Em đã sửa hết lỗi sai'}</b></div><div class="small muted">Làm đúng lại thì câu đó được tính là đã sửa</div></div></div>
    ${open.length ? `<button class="btn soft" data-act="retry" data-v="${open.map(m => m.q.id).join(',')}">${ic('retry','sm')} Luyện lại ${open.length} câu</button>` : ''}
  </div></div>`;
  return `<div class="split"><div style="display:flex;flex-direction:column;gap:20px;min-width:0">${todayCards}${masteryCard(st)}</div><div style="display:flex;flex-direction:column;gap:20px;min-width:0">${streakCard}${mcard}</div></div>`;
}
function masteryOf(st){
  const per = {};
  for (const b of subsOf(st.id)) { const a = A(b.aid); for (const qid of a.qids) { const q = Q(qid); if (!q) continue; const p = per[q.topic] ||= {n:0, c:0}; p.n++; if (isRight(q, b.answers[qid]?.value) || S.fixed[st.id]?.[qid]) p.c++; } }
  for (const [t, p] of Object.entries(S.practice[st.id] || {})) { const x = per[t] ||= {n:0, c:0}; x.n += p.n; x.c += p.c; }
  return per;
}
function masteryCard(st){
  const per = masteryOf(st);
  return `<div class="card"><div class="card-h"><div><h2>Mức thành thạo</h2><p>Gồm bài được giao, câu đã sửa lại đúng và các lượt tự luyện</p></div></div><div class="card-b">
    ${TOPICS.map(t => { const p = per[t]; const r = p && p.n ? p.c / p.n : 0; return `<div class="hbar"><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="chip topic" style="${tcv(t)};padding:0;width:8px;height:8px"></span>${esc(t)}</span><div class="tr"><i style="width:${r * 100}%;background:var(${tvar(t)})"></i></div><span class="v">${p && p.n ? pct(r) : '–'}</span></div>`; }).join('')}
  </div></div>`;
}
// trang chuyên đề: các thư mục giáo viên tạo; học sinh tự chọn luyện, không bắt buộc
function sTopics(st){
  const tops = topicsOf(st.grade);
  if (ui.stTopic) {
    const t = tops.find(x => x.name === ui.stTopic);
    if (!t) { ui.stTopic = null; return sTopics(st); }
    const qs = S.bank.filter(q => q.grade === st.grade && q.topic === t.name);
    const lv = ui.prLevel || st.level, cnt = l => qs.filter(q => l === 'all' || q.levels.includes(l)).length;
    const p = S.practice[st.id]?.[t.name];
    return `<div class="row"><button class="btn ghost sm" data-act="st-back" style="padding-left:0">${ic('back','sm')} Tất cả chuyên đề</button></div>
      <div class="card today" style="${tcv(t.name)}"><div class="band" data-g="${esc(glyph(t.name))}"><div class="k">${ic('folder','sm')} Chuyên đề · Toán ${st.grade}</div><h2>${esc(t.name)}</h2>
        <div class="meta"><span>${ic('list','sm')} ${qs.length} câu hỏi</span><span>${ic('file','sm')} ${t.docs.length} tài liệu</span>${p ? `<span>${ic('check','sm')} đã tự luyện ${p.n} câu, đúng ${pct(p.c / p.n)}</span>` : ''}</div></div></div>
      <div class="split even">
        <div class="card"><div class="card-h"><div><h2>Tự luyện</h2><p>Không tính điểm, không giới hạn số lần. Câu sai sẽ vào Sổ lỗi sai để em làm lại.</p></div></div><div class="card-b">
          <div class="fl">Độ khó<div class="cbxs">${[...LEVELS, 'all'].map(l => `<button class="fchip" data-act="pr-level" data-v="${l}" aria-pressed="${lv === l}">${l === 'all' ? 'Trộn tất cả' : l} <span class="muted">(${cnt(l)})</span></button>`).join('')}</div></div>
          <div class="row">${[5, 10].map(n => `<button class="btn ${n === 5 ? 'cta' : 'sec'}" data-act="practice" data-v="${n}" ${cnt(lv) ? '' : 'disabled'}>${ic('play','fill sm')} Luyện ${n} câu</button>`).join('')}</div>
          ${cnt(lv) ? '' : '<p class="small muted">Chuyên đề này chưa có câu hỏi ở độ khó này. Chọn độ khó khác nhé.</p>'}
        </div></div>
        <div class="card"><div class="card-h"><div><h2>Tài liệu</h2><p>Thầy cô tải lên cho chuyên đề này</p></div></div><div class="card-b">
          ${t.docs.length ? `<div class="docs">${t.docs.map(d => docChip(d)).join('')}</div>` : '<div class="emptyst" style="padding:12px">Chưa có tài liệu nào.</div>'}
        </div></div>
      </div>`;
  }
  const per = masteryOf(st);
  return `<div class="card"><div class="card-b" style="padding-top:18px"><p>Các chuyên đề thầy cô đã tạo cho Toán ${st.grade}. Em chọn chuyên đề muốn ôn, đọc tài liệu và tự luyện bao nhiêu câu tùy thích.</p></div></div>
    <div class="grid g3">${tops.map(t => {
      const nq = S.bank.filter(q => q.grade === st.grade && q.topic === t.name).length, p = per[t.name], r = p && p.n ? p.c / p.n : null;
      return `<button class="card course tcard" style="${tcv(t.name)}" data-act="st-topic" data-v="${esc(t.name)}"><div class="band" data-g="${esc(glyph(t.name))}"><span>${ic('folder','sm')} Thư mục</span><b>${esc(t.name)}</b></div>
        <div class="cb"><div class="row small" style="gap:6px"><span class="chip">${nq} câu hỏi</span><span class="chip">${t.docs.length} tài liệu</span></div>
          <div class="row between small"><span class="muted">Mức thành thạo</span><b>${r == null ? 'Chưa luyện' : pct(r)}</b></div><div class="prog"><i style="width:${(r || 0) * 100}%"></i></div></div></button>`;
    }).join('') || '<div class="card"><div class="emptyst">Thầy cô chưa tạo chuyên đề nào.</div></div>'}</div>`;
}
function sMistakes(st){
  const ms = mistakes(st.id), open = ms.filter(m => !m.fixed), done = ms.filter(m => m.fixed);
  if (!ms.length) return `<div class="card"><div class="emptyst"><div class="ib">${ic('book')}</div><b style="color:var(--ink)">Sổ lỗi sai đang trống</b>Câu nào em làm sai sẽ được ghi vào đây để em làm lại.</div></div>`;
  const head = `<div class="card"><div class="card-b" style="padding-top:20px"><div class="row" style="gap:18px">
    ${ring(ms.length ? done.length / ms.length : 0, 76, 8, 'var(--success)', pct(done.length / ms.length))}
    <div style="flex:1;min-width:200px"><h2>${open.length ? `Còn ${open.length} câu cần làm lại` : 'Em đã sửa hết lỗi sai!'}</h2><p class="small muted">Đã sửa ${done.length}/${ms.length} câu. Làm lại đúng một câu thì câu đó được đánh dấu đã sửa.</p></div>
    ${open.length ? `<button class="btn cta lg" data-act="retry" data-v="${open.map(m => m.q.id).join(',')}">${ic('play','fill sm')} Luyện lại tất cả</button>` : ''}</div></div></div>`;
  const tnames = [...new Set(TOPICS.concat(open.map(m => m.q.topic)))];
  const groups = tnames.map(t => [t, open.filter(m => m.q.topic === t)]).filter(([, l]) => l.length);
  const body = groups.map(([t, l]) => `<div class="card"><div class="card-h"><div class="row" style="gap:10px">${topicChip(t)}<span class="small muted">${l.length} câu</span></div></div><div class="card-b" style="padding-top:8px"><div class="list">
    ${l.map(m => `<div class="li"><div class="grow"><div class="qt">${esc(m.q.text)}${qImg(m.q, 'sm')}${tfList(m.q)}</div><div class="ansl" style="margin-top:4px"><span>Lần trước: <span class="w">${esc(showVal(m.value))}</span></span><span class="muted">${m.practice ? 'tự luyện' : 'sai'} ngày ${fmtDate(m.date)}</span></div></div><button class="btn sec sm" data-act="retry" data-v="${m.q.id}">${ic('retry','sm')} Làm lại</button></div>`).join('')}
  </div></div></div>`).join('');
  const fixed = done.length ? `<details class="sub"><summary><div class="grow"><b>Các câu đã sửa (${done.length})</b></div>${ic('chev','chev')}</summary><div class="body"><div class="list">${done.map(m => `<div class="li"><span class="chip ok">${ic('check','sm')}</span><div class="grow"><div class="qt">${esc(m.q.text)}</div></div>${topicChip(m.q.topic)}</div>`).join('')}</div></div></details>` : '';
  return head + body + fixed;
}
function sHistory(st){
  const subs = subsOf(st.id), avg = mean(subs.map(b => scoreOf(b).ten));
  const missed = S.assignments.filter(a => sees(a, st) && a.date < TODAY && !subFor(a.id, st.id)).length;
  return `<div class="grid g4">
    <div class="card kpi"><div class="ico" style="background:var(--primary-soft);color:var(--primary)">${ic('list')}</div><div><div class="t">Bài đã nộp</div><div class="v">${subs.length}</div></div></div>
    <div class="card kpi"><div class="ico" style="background:var(--success-soft);color:var(--success)">${ic('trophy')}</div><div><div class="t">Điểm trung bình</div><div class="v">${avg == null ? '–' : dec(avg)}<small>/10</small></div></div></div>
    <div class="card kpi"><div class="ico" style="background:var(--warn-soft);color:var(--t4)">${ic('flame','fill')}</div><div><div class="t">Chuỗi ngày</div><div class="v">${streakOf(st.id)}</div></div></div>
    <div class="card kpi"><div class="ico" style="background:var(--danger-soft);color:var(--danger)">${ic('x')}</div><div><div class="t">Bài bỏ lỡ</div><div class="v">${missed}</div></div></div></div>
    <div>${subs.length ? subs.map(b => subRow(b, false, false)).join('') : `<div class="card"><div class="emptyst"><div class="ib">${ic('clock')}</div>Em chưa nộp bài nào.</div></div>`}</div>`;
}

// ---------- màn làm bài ----------
function startPlayer(mode, qids, aid, extra = {}){
  ui.player = {mode, aid, qids, i:0, answers:{}, works:{}, checked:false, res:[], exit:false, done:false, ...extra};
  render();
}
function startPractice(n){
  const st = STU(ui.sid), lv = ui.prLevel || st.level;
  const pool = S.bank.filter(q => q.grade === st.grade && q.topic === ui.stTopic && (lv === 'all' || q.levels.includes(lv)));
  if (!pool.length) return;
  startPlayer('practice', shuffle(pool).slice(0, n).map(q => q.id), null, {topic:ui.stTopic, n});
}
function renderPlayer(){
  const el = $('#player'), p = ui.player;
  document.body.style.overflow = p ? 'hidden' : '';
  if (!p) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const n = p.qids.length;
  const bar = `<div class="pbar" aria-label="Tiến độ">${p.qids.map((_, i) => `<i class="${i < p.res.length ? (p.res[i] ? 'ok' : 'bad') : i === p.i && !p.done ? 'cur' : ''}"></i>`).join('')}</div>`;

         <div class="row"><button class="btn cta lg" data-act="p-again">${ic('retry','sm')} Luyện tiếp ${p.n} câu</button><button class="btn sec lg" data-act="p-finish">Về chuyên đề</button></div>`

    return;

  const body = `<div class="pc"><div class="pin">

  el.innerHTML = head + body + foot + dlg;
  if (!p.checked && !p.exit) { const inp = $('#p-input'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
  else if (p.checked) $('#p-next')?.focus();
}
function pCheck(){
  const p = ui.player, qid = p.qids[p.i], q = Q(qid);
  if (!answered(q, p.answers[qid]) || p.checked) return;
  p.checked = true;
  const ok = isRight(q, p.answers[qid]);
  p.res.push(ok);
  if (p.mode === 'retry' && ok) { (S.fixed[ui.sid] ||= {})[qid] = true; save(); }
  if (p.mode === 'practice') {
    const r = ((S.practice[ui.sid] ||= {})[q.topic] ||= {n:0, c:0}); r.n++; if (ok) r.c++;
    if (!ok) { (S.pwrong[ui.sid] ||= {})[qid] = {value:String(p.answers[qid]).trim(), date:TODAY}; if (S.fixed[ui.sid]) delete S.fixed[ui.sid][qid]; }
    save();
  }
  render();
}
function pNext(){
  const p = ui.player;
  if (p.i < p.qids.length - 1) { p.i++; p.checked = false; render(); return; }
  if (p.mode === 'assign') {
    const now = new Date(), answers = {};
    p.qids.forEach(qid => answers[qid] = {value:String(p.answers[qid] ?? '').trim(), work:(p.works[qid] || '').trim()});
    S.submissions.push({id:'b' + S.n++, aid:p.aid, sid:ui.sid, at:TODAY + 'T' + z(now.getHours()) + ':' + z(now.getMinutes()), answers});
    save();
  }
  p.done = true; render();
}

const ARMABLE = ['del-a', 'reset', 'acc-del', 'tp-del', 'cl-del'];
document.addEventListener('click', e => {

  const act = el.dataset.act, v = el.dataset.v;
  if (!ARMABLE.includes(act)) ui.armed = null;
  const p = ui.player;
  const arm = key => { if (ui.armed !== key) { ui.armed = key; render(); return false; } ui.armed = null; return true; };
  switch (act) {
    case 'tab': go(v); break;
    case 'grade': if (Number(v) !== ui.grade) { if (ui.tab.teacher === 'compose') syncCompose(); ui.grade = Number(v); ui.compose = null; ui.bankTopic = 'all'; ui.tSid = null; ui.an.level = 'all'; ui.an.cls = 'all'; ui.accMsg = null; ui.tpMsg = null; render(); } break;

    case 'pick-work': ui.tSid = v; render(); break;
    case 'compose-for': ui.compose = null; go('compose'); break;
    case 'c-add': syncCompose(); ui.compose.qids.push(v); ui.compose.msg = null; render(); break;
    case 'c-rm': syncCompose(); ui.compose.qids = ui.compose.qids.filter(x => x !== v); render(); break;
    case 'c-clear': syncCompose(); ui.compose.qids = []; render(); break;
    case 'c-gen': genExam(); break;
    case 'c-addtopic': {
      const name = $('#c-newtopic').value.trim(), c = ui.compose;
      if (!name) { $('#c-newtopic').focus(); break; }
      syncCompose();
      if (topicsOf(ui.grade).some(t => t.name.toLowerCase() === name.toLowerCase())) { c.msg = {ok:false, text:`Khối ${ui.grade} đã có chuyên đề "${name}".`}; render(); break; }
      S.topics.push({id:'tp' + S.n++, grade:ui.grade, name, docs:[]}); save();
      c.topic = name; c.addingTopic = false; c.msg = {ok:true, text:`Đã thêm chuyên đề "${name}" và chọn làm chuyên đề chính của bài.`}; render(); break;
    }
    case 'c-canceltopic': syncCompose(); ui.compose.addingTopic = false; render(); break;
    case 'c-newq': syncCompose(); ui.compose.newQ = {type:'mc', text:'', answer:'', options:['','','',''], correct:0, statements:['','','',''], tfans:['Đ','Đ','Đ','Đ'], explain:'', levels:[...(ui.compose.levels.length ? ui.compose.levels : LEVELS)]}; ui.compose.msg = null; render(); break;
    case 'c-cancelq': syncCompose(); ui.compose.newQ = null; render(); break;
    case 'c-saveq': saveNewQ(); break;
    case 'c-rmimg': syncCompose(); delete ui.compose.newQ.img; render(); break;
    case 'c-rmdoc': syncCompose(); ui.compose.docs = ui.compose.docs.filter(d => d.id !== v); render(); break;
    case 'ins': {
      const f = $('#' + (ui.lastField || 'nq-text')) || $('#nq-text'); if (!f) break;
      const a = f.selectionStart ?? f.value.length, b = f.selectionEnd ?? a, before = f.value.slice(0, a);
      const inMath = (before.match(/\$/g) || []).length % 2 === 1, ins = inMath ? v : '$' + v + '$';
      f.value = before + ins + f.value.slice(b); const cur = a + ins.length - (inMath ? 0 : 1);
      f.focus(); f.setSelectionRange(cur, cur); f.dispatchEvent(new Event('input', {bubbles:true})); break;
    }
    case 'c-save': saveCompose(); break;
    case 'bank-topic': syncCompose(); ui.bankTopic = v; render(); break;
    case 'del-a':
      if (!arm(v)) return;
      S.assignments = S.assignments.filter(a => a.id !== v); S.submissions = S.submissions.filter(b => b.aid !== v);
      save(); render(); toast('Đã xoá bài.'); break;
    case 'an-range': ui.an.range = v; render(); break;
    case 'an-level': ui.an.level = v; render(); break;
    case 'an-cls': ui.an.cls = v; render(); break;
    case 'reassign': {
      const ids = analysisData().qs.filter(s => s.w > 0).sort((x, y) => y.w / y.n - x.w / x.n || y.w - x.w).slice(0, 4).map(s => s.q.id);
      ui.compose = {...newCompose(), date:addDays(TODAY, 1), title:'Ôn lại các câu hay sai', qids:ids, topic:Q(ids[0])?.topic || TOPICS[0],
        levels:ui.an.level === 'all' ? [...LEVELS] : [ui.an.level], classes:ui.an.cls === 'all' ? classesOf(ui.grade).map(c => c.id) : [ui.an.cls]};
      go('compose'); break;
    }
    // chuyên đề & tài liệu
    case 'tp-add': {
      const name = $('#tp-new').value.trim();
      if (!name) { ui.tpMsg = {ok:false, text:'Nhập tên chuyên đề.'}; render(); break; }
      if (topicsOf(ui.grade).some(t => t.name === name)) { ui.tpMsg = {ok:false, text:`Khối ${ui.grade} đã có chuyên đề "${name}".`}; render(); break; }
      S.topics.push({id:'tp' + S.n++, grade:ui.grade, name, docs:[]}); save(); ui.tpMsg = {ok:true, text:`Đã thêm chuyên đề "${name}". Học sinh khối ${ui.grade} sẽ thấy thư mục này.`}; render(); break;
    }
    case 'tp-rename': renameTopic(v); break;
    case 'tp-del': {
      const t = S.topics.find(x => x.id === v), nq = S.bank.filter(q => q.grade === t.grade && q.topic === t.name).length;
      if (nq) { ui.armed = null; ui.tpMsg = {ok:false, text:`Chuyên đề "${t.name}" còn ${nq} câu hỏi nên chưa xoá được. Bản demo chỉ cho xoá chuyên đề trống để không mất câu hỏi.`}; render(); break; }
      if (!arm('tp-' + v)) return;
      S.topics = S.topics.filter(x => x.id !== v); save(); ui.tpMsg = {ok:true, text:`Đã xoá chuyên đề "${t.name}".`}; render(); break;
    }
    case 'tp-rmdoc': for (const t of S.topics) t.docs = t.docs.filter(d => d.id !== v); save(); render(); toast('Đã xoá tài liệu.'); break;
    case 'open-doc': ui.viewer = v; renderViewer(); break;
    case 'close-doc': ui.viewer = null; renderViewer(); break;
    // lớp
    case 'cl-add': {
      const name = $('#cl-new').value.trim();
      if (!name) { ui.accMsg = {ok:false, text:'Nhập tên lớp.'}; render(); break; }
      if (S.classes.some(c => c.name.toLowerCase() === name.toLowerCase())) { ui.accMsg = {ok:false, text:`Đã có lớp ${name}.`}; render(); break; }
      S.classes.push({id:'c' + S.n++, grade:ui.grade, name}); save(); ui.accMsg = {ok:true, text:`Đã thêm lớp ${name}. Thêm học sinh vào lớp ở ô bên cạnh hoặc đổi lớp trong bảng.`}; render(); break;
    }
    case 'cl-rename': {
      const c = CL(v), name = $('#cl-name-' + v).value.trim();
      if (!name || name === c.name) break;
      if (S.classes.some(x => x.id !== v && x.name.toLowerCase() === name.toLowerCase())) { ui.accMsg = {ok:false, text:`Đã có lớp ${name}.`}; render(); break; }
      const old = c.name; c.name = name; save(); ui.accMsg = {ok:true, text:`Đã đổi lớp ${old} thành ${name}.`}; render(); break;
    }
    case 'cl-del': {
      const c = CL(v), n = S.students.filter(s => s.cls === v).length;
      if (n) { ui.armed = null; ui.accMsg = {ok:false, text:`Lớp ${c.name} còn ${n} học sinh. Chuyển các em sang lớp khác trước khi xoá.`}; render(); break; }
      if (!arm('cl-' + v)) return;
      S.classes = S.classes.filter(x => x.id !== v); S.assignments.forEach(a => a.classes = (a.classes || []).filter(x => x !== v)); save(); ui.accMsg = {ok:true, text:`Đã xoá lớp ${c.name}.`}; render(); break;
    }
    // học sinh tự học
    case 'st-topic': ui.stTopic = v; ui.prLevel = null; render(); window.scrollTo(0, 0); break;
    case 'st-back': ui.stTopic = null; render(); window.scrollTo(0, 0); break;
    case 'pr-level': ui.prLevel = v; render(); break;
    case 'practice': startPractice(Number(v)); break;
    case 'review': ui.review[v] = !ui.review[v]; render(); break;
    case 'start': { const a = A(v); if (a && !subFor(a.id, ui.sid)) startPlayer('assign', [...a.qids], a.id); break; }
    case 'retry': startPlayer('retry', v.split(',').filter(id => Q(id)), null); break;
    case 'p-pick': if (p && !p.checked) { const q = Q(p.qids[p.i]); p.answers[q.id] = q.options[Number(v)]; render(); } break;
    case 'p-check': pCheck(); break;
    case 'p-tf': if (p && !p.checked) { const qid = p.qids[p.i], a = (p.answers[qid] || '____').split(''); a[Number(v[0])] = v.slice(1); p.answers[qid] = a.join(''); render(); } break;
    case 'p-next': pNext(); break;
    case 'p-close': if (p.done) { ui.player = null; render(); } else { p.exit = true; render(); } break;
    case 'p-stay': p.exit = false; render(); break;
    case 'p-quit': ui.player = null; render(); break;
    case 'p-finish': ui.player = null; render(); window.scrollTo(0, 0); break;
    case 'p-again': ui.player = null; startPractice(p.n); break;
    case 'p-retry-now': { const ids = p.qids.filter((_, i) => !p.res[i]); startPlayer('retry', ids, null); break; }
    // đăng nhập & tài khoản
    case 'logout': setAuth(null); ui.player = null; ui.viewer = null; ui.loginErr = null; ui.compose = null; ui.review = {}; ui.stTopic = null; render(); window.scrollTo(0, 0); break;
    case 'demo-login': setAuth(v === 'teacher' ? {role:'teacher'} : {role:'student', sid:v}); ui.tab = {teacher:'today', student:'today'}; ui.stTopic = null; render(); window.scrollTo(0, 0); break;
    case 'acc-add': { const n = $('#acc-name').value.trim(); if (!n) { ui.accMsg = {ok:false, text:'Nhập họ tên học sinh.'}; render(); break; } ui.accMsg = {ok:true, list:addStudents([n], $('#acc-level').value, $('#acc-cls').value)}; render(); break; }
    case 'acc-bulk': { const names = $('#acc-bulk').value.split(/\n/).map(x => x.trim()).filter(Boolean); if (!names.length) { ui.accMsg = {ok:false, text:'Dán danh sách họ tên, mỗi dòng một em.'}; render(); break; } ui.accMsg = {ok:true, list:addStudents(names, $('#acc-level').value, $('#acc-cls').value)}; render(); break; }
    case 'acc-reset': { const x = STU(v); x.pass = genPass(); save(); ui.accMsg = {ok:true, text:`Đã đổi mật khẩu cho ${x.name}: ${x.pass}`}; render(); break; }
    case 'acc-del': {
      if (!arm('del-' + v)) return;
      const x = STU(v); S.students = S.students.filter(s => s.id !== v); S.submissions = S.submissions.filter(b => b.sid !== v); delete S.fixed[v]; delete S.practice[v]; delete S.pwrong[v]; if (ui.tSid === v) ui.tSid = null; save(); render(); toast('Đã xoá tài khoản ' + x.name + '.'); break;
    }
    case 'acc-copy': copyAccounts(v === 'all' ? SG() : [STU(v)]); break;
    case 'reset':
      if (ui.armed !== 'reset') { ui.armed = 'reset'; el.textContent = 'Bấm lần nữa để đặt lại'; return; }
      S = seed(); save(); ui.armed = null; ui.compose = null; ui.player = null; ui.viewer = null; ui.review = {}; ui.accMsg = null; ui.tpMsg = null; ui.stTopic = null; if (AUTH && AUTH.role === 'student' && !STU(AUTH.sid)) setAuth(null); el.textContent = 'Đặt lại dữ liệu mẫu'; render(); toast('Đã đặt lại dữ liệu mẫu.'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'set-level') { STU(t.dataset.v).level = t.value; save(); render(); toast('Đã chuyển sang nhóm ' + t.value + '.'); }
  else if (t.dataset.act === 'set-cls') { const s = STU(t.dataset.v), c = CL(t.value); s.cls = c.id; s.grade = c.grade; save(); render(); toast(`Đã chuyển ${s.name} sang lớp ${c.name}.`); }
  else if (t.dataset.act === 'c-refresh') { syncCompose(); render(); }
  else if (t.id === 'c-topic' && t.value === '__new__') { syncCompose(); ui.compose.addingTopic = true; render(); $('#c-newtopic')?.focus(); }
  else if (t.id === 'nq-img' && t.files && t.files[0]) { syncCompose(); compressImage(t.files[0]).then(d => { ui.compose.newQ.img = d; render(); }, () => toast('Không đọc được ảnh này, thử ảnh khác.')); }
  else if (t.id === 'c-doc' && t.files && t.files.length) { syncCompose(); uploadDocs([...t.files], ui.compose.docs).then(() => render()); }
  else if (t.classList.contains('tp-file') && t.files && t.files.length) {
    const tp = S.topics.find(x => x.id === t.dataset.topic), files = [...t.files];
    uploadDocs(files, tp.docs).then(added => {
      if (!added.length) return render();
      if (!save()) { tp.docs = tp.docs.filter(d => !added.includes(d)); ui.tpMsg = {ok:false, text:'Bộ nhớ trình duyệt đầy (bản demo giới hạn khoảng 5 MB) nên chưa lưu được tài liệu. Xoá bớt tài liệu cũ rồi thử lại.'}; }
      else ui.tpMsg = {ok:true, text:`Đã tải ${added.length} tài liệu vào chuyên đề "${tp.name}".`};
      render();
    });
  }
});
document.addEventListener('mousedown', e => { if (e.target.closest('.mathbar button')) e.preventDefault(); });
document.addEventListener('focusin', e => { if (/^nq-(text|exp|ans|o\d|s\d)$/.test(e.target.id || '')) ui.lastField = e.target.id; });
document.addEventListener('input', e => {
  if (e.target.id !== 'nq-text') return;
  clearTimeout(ui.prevT);
  ui.prevT = setTimeout(() => { const pv = $('#nq-prev'); if (!pv) return; pv.innerHTML = e.target.value.trim() ? esc(e.target.value) : '<span class="muted small">Đề bài sẽ hiện ở đây đúng như học sinh thấy</span>'; const M = window.MathJax; if (M && M.typesetPromise) M.typesetPromise([pv]).catch(() => {}); }, 250);
});
document.addEventListener('input', e => {
  const p = ui.player; if (!p) return;
  const qid = p.qids[p.i];
  if (e.target.id === 'p-input') { p.answers[qid] = e.target.value; const b = $('#p-check'); if (b) b.disabled = !e.target.value.trim(); }
  else if (e.target.id === 'p-work') p.works[qid] = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.viewer) { ui.viewer = null; renderViewer(); return; }
  if (e.key === 'Enter' && e.target.id === 'c-newtopic') { e.preventDefault(); $('[data-act=c-addtopic]')?.click(); return; }
  const p = ui.player; if (!p || p.done || p.exit) return;
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') { e.preventDefault(); p.checked ? pNext() : pCheck(); }
  else if (e.key === 'Escape') { p.exit = true; render(); }
});
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'login-form') doLogin(); });

render();

</script>
</body>
